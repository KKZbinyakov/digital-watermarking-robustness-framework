name: Generate Architecture Diagram

on:
  push:
    branches: [main, master]
    paths:
      - '**.py'
  pull_request:
    branches: [main, master]
    paths:
      - '**.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare environment
        run: |
          mkdir -p docs
          ls -la
          test -f diagen.py || (echo "ERROR: diagen.py not found!" && exit 1)

      - name: Generate tree
        run: |
          set -e
          python diagen.py . docs/architecture.html
          cp docs/architecture.html docs/index.html
          ls -la docs/

      - name: Upload artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram
          path: docs/architecture.html
          retention-days: 5

      - name: Comment PR with preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `🌳 **Architecture diagram updated.**\n\nDownload preview: [Artifacts → architecture-diagram](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('Architecture diagram'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Check for changes
        if: github.event_name == 'push'
        id: check
        run: |
          if git diff --quiet HEAD -- docs/architecture.html docs/index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: github.event_name == 'push' && steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.html docs/index.html
          git commit -m "docs: auto-update architecture diagram [skip ci]"
          git push

      - name: Setup Pages
        if: github.event_name == 'push' && steps.check.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && steps.check.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4