name: Solution tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Solutions (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "numpy>=2.0" "scipy>=1.10.0"

      - name: Build Cython extensions
        run: python setup.py build_ext --inplace

      # No dedicated tests target Contourlet, DCT, DFT, or DWT.
      # Package builds and registry imports still compile/load their extensions.
      # Model-backed pyiqa checks and author-image audits remain opt-in.
      - name: Run solution and pipeline tests
        run: >-
          python -m pytest -q -ra --no-cov
          --junitxml=test-results/junit.xml
          tests/attacks
          tests/expertise
          tests/embeddings/test_adc_abw.py
          tests/embeddings/test_contourlet_wu2023.py
          tests/test_categories.py
          tests/pipeline_core

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: solution-tests-${{ runner.os }}-python-${{ matrix.python-version }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
