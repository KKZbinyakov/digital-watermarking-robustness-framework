[build-system]
requires = ["setuptools>=42", "Cython>=3.0.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dwarf"
version = "0.0.1"
description = "Фреймворк для автоматизированной оценки устойчивости алгоритмов встраивания цифровых водяных знаков."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Збиняков Кирилл Константинович", email = "kkzbiniakov@edu.hse.ru"},
    {name = "Сидоров Евгений Александрович", email = "easidorov@edu.hse.ru"},
    {name = "Горенкин Евгений Алексеевич", email = "eagorenkin@edu.hse.ru"},
    {name = "Полинов Сергей Васильевич", email = "svpolinov@edu.hse.ru"},
    {name = "Большеглазов Максим Ильич", email = "mibolsheglazov@edu.hse.ru"},

]
dependencies = [      # Эти зависимости устанавливаются при установке пакета
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]  # Эти зависимости устанавливаются при установке пакета с опциональными зависимостями pip install dwarf[ready_solutions]
ready_solutions = [ # Список есть в документе Жени, пока сюда не буду всё записывать
    "scipy>=1.10.0",
    "torch>=2.0.0",
]
codecs = [    # Кодеки для атак сжатия Heic и Avif; без них эти атаки поднимают RuntimeError
    "pillow-heif>=0.13",
    "pillow-avif-plugin>=1.4",
]
metrics = [   # Нейросетевые метрики LPIPS, DISTS, NIQE и BRISQUE; тянет torch
    "pyiqa>=0.1.10",
]

dev = [      # Это зависимости для разработки
    "pytest>=7.0.0",
    "black>=22.0",
    "pytest-cov>=4.0",
    "Cython>=3.0.0",
    "setuptools>=42",
    # Эталонные реализации для сверки метрик в tests/test_expertise.py и
    # tests/test_attacks.py. Без них соответствующие проверки не падают,
    # а молча пропускаются, поэтому список обязан совпадать с requirements-dev.txt.
    "opencv-python-headless>=4.8",   # CLAHE
    "scikit-image>=0.21",            # MSE, PSNR, SSIM
    "sewar>=0.4.5",                  # MS-SSIM
    "scikit-learn>=1.3",             # accuracy, precision, recall, F1, AUC
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dwarf*"]

[project.urls]     # Ссылки на дополнительную информацию, у нас пока ничего нет, мб потом сделаем.
Homepage = "https://github.com/KKZbinyakov/digital-watermarking-robustness-framework"
# Documentation = "https://readthedocs.io"

[tool.ruff]
target-version = "py310"          # версия Python для совместимости
line-length = 120                 # как в black (или 100/120 на ваш вкус)
indent-width = 4

[tool.ruff.format]
quote-style = "double"            # двойные кавычки (как black)
indent-style = "space"            # пробелы, не табы
skip-magic-trailing-comma = false # уважать висячие запятые
docstring-code-format = true      # форматировать код в docstrings

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (ошибки)
    "W",   # pycodestyle (предупреждения)
    "F",   # Pyflakes
    "I",   # isort (сортировка импортов)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",
    "N801",
    "N805"]  # длинные строки — форматтер сам разберётся

exclude = [
    "main.py",
    "tests/*.py",
    "diagen.py",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=dwarf"
testpaths = [
    "tests",
]